<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Depth Peeling 多 Pass 数据流</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --card: #fff;
      --fg: #18181b;
      --muted: #71717a;
      --line: #d4d4d8;
      --peel: #2563eb;
      --blend: #7c3aed;
      --final: #059669;
      --tex: #c2410c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
      color: var(--fg);
      background: var(--bg);
      padding: 24px 16px 48px;
    }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 20px; max-width: 40rem; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      margin-bottom: 16px;
    }
    button {
      font: inherit; padding: 8px 14px; border: 1px solid var(--line);
      background: var(--card); border-radius: 8px; cursor: pointer;
    }
    button:hover { border-color: var(--fg); }
    button.primary { background: var(--fg); color: #fff; border-color: var(--fg); }
    #stepLabel { color: var(--muted); font-variant-numeric: tabular-nums; }
    .stage {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      max-width: 820px;
      min-height: 420px;
    }
    svg { width: 100%; height: auto; display: block; }
    .box {
      fill: #fafafa; stroke: var(--fg); stroke-width: 1.5;
    }
    .box.peel { fill: #eff6ff; stroke: var(--peel); }
    .box.blend { fill: #f5f3ff; stroke: var(--blend); }
    .box.final { fill: #ecfdf5; stroke: var(--final); }
    .box.tex { fill: #fff7ed; stroke: var(--tex); }
    .box.dim { opacity: 0.28; }
    .lbl { font-size: 12px; fill: var(--fg); }
    .lbl-sm { font-size: 11px; fill: var(--muted); }
    .arrow { fill: none; stroke: var(--fg); stroke-width: 1.5; marker-end: url(#arrowHead); }
    .arrow.tex { stroke: var(--tex); marker-end: url(#arrowTex); }
    .arrow.dim { opacity: 0.2; }
    .packet {
      fill: var(--peel); stroke: none;
      transition: transform 0.45s ease;
    }
    .packet.blend { fill: var(--blend); }
    .packet.tex { fill: var(--tex); }
    .hint {
      margin-top: 16px; max-width: 820px; padding: 12px 14px;
      background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    }
    .hint strong { font-weight: 600; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px 20px; margin: 12px 0 0; font-size: 13px; color: var(--muted); }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
    @media (prefers-reduced-motion: reduce) {
      .packet { transition: none; }
    }
  </style>
</head>
<body>
  <h1>Depth Peeling 多 Pass 数据流</h1>
  <p class="lead">
    <strong>A Peel</strong>：场景几何 + MVP，写入 <code>fboPeel_</code>。
    <strong>B Blend</strong>：NDC 全屏 quad，采样 peel 颜色，硬件混合进 <code>fboAccum_</code>。
    Pass 间仅通过 <strong>FBO / 纹理</strong> 传递，无 varying 跨 Pass。
  </p>

  <div class="controls">
    <button type="button" class="primary" id="btnNext">下一步</button>
    <button type="button" id="btnPrev">上一步</button>
    <button type="button" id="btnReset">从头</button>
    <span id="stepLabel"></span>
  </div>

  <div class="stage" aria-label="Depth Peeling 多 Pass 数据流示意">
    <svg viewBox="0 0 800 380" role="img" aria-labelledby="svgTitle">
      <title id="svgTitle">Depth Peeling pass data flow</title>
      <defs>
        <marker id="arrowHead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#18181b" />
        </marker>
        <marker id="arrowTex" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#c2410c" />
        </marker>
      </defs>

      <!-- Mesh pool (same on disk) -->
      <rect class="box" x="24" y="24" width="160" height="72" rx="8" />
      <text class="lbl" x="40" y="52">磁盘上的网格</text>
      <text class="lbl-sm" x="40" y="72">Spot / 玻璃 / quad.obj</text>

      <!-- Peel -->
      <rect id="peelBox" class="box peel" x="240" y="20" width="200" height="120" rx="8" />
      <text class="lbl" x="256" y="48">① Peel Draw</text>
      <text class="lbl-sm" x="256" y="68">shader: render.*</text>
      <text class="lbl-sm" x="256" y="88">几何: 整场景再画</text>
      <text class="lbl-sm" x="256" y="108">输出 → fboPeel_</text>

      <!-- fboPeel texture -->
      <rect id="peelTex" class="box tex" x="500" y="40" width="140" height="80" rx="8" />
      <text class="lbl" x="516" y="72">fboPeel_.color</text>
      <text class="lbl-sm" x="516" y="92">本层颜色纹理</text>

      <!-- Blend -->
      <rect id="blendBox" class="box blend" x="240" y="180" width="200" height="120" rx="8" />
      <text class="lbl" x="256" y="208">② Blend Draw</text>
      <text class="lbl-sm" x="256" y="228">shader: blend.*</text>
      <text class="lbl-sm" x="256" y="248">几何: 全屏 quad</text>
      <text class="lbl-sm" x="256" y="268">读 peel 纹理混合</text>

      <!-- fboAccum -->
      <rect id="accumBox" class="box tex" x="500" y="200" width="140" height="80" rx="8" />
      <text class="lbl" x="516" y="232">fboAccum_</text>
      <text class="lbl-sm" x="516" y="252">累积颜色+透射</text>

      <!-- Final -->
      <rect id="finalBox" class="box final" x="240" y="320" width="200" height="48" rx="8" />
      <text class="lbl" x="256" y="350">③ Final → 屏幕</text>

      <!-- static structure arrows (dim by default, brightened by step) -->
      <path id="aMeshPeel" class="arrow dim" d="M184,60 H232" />
      <path id="aPeelTex" class="arrow tex dim" d="M440,80 H492" />
      <path id="aTexBlend" class="arrow tex dim" d="M570,120 V170 H440 V230 H440" />
      <path id="aMeshBlend" class="arrow dim" d="M104,96 V240 H232" />
      <path id="aBlendAccum" class="arrow tex dim" d="M440,240 H492" />
      <path id="aAccumFinal" class="arrow tex dim" d="M570,280 V344 H440" />

      <!-- moving packet -->
      <circle id="packet" class="packet" r="8" cx="60" cy="60" opacity="0" />
    </svg>
  </div>

  <div class="legend">
    <span><span class="sw" style="background:#2563eb"></span>Peel 管线</span>
    <span><span class="sw" style="background:#7c3aed"></span>Blend 管线</span>
    <span><span class="sw" style="background:#c2410c"></span>纹理接力（唯一跨 Pass 数据）</span>
  </div>

  <div class="hint" id="hint"></div>

  <script>
    const steps = [
      {
        title: "0 · 准备",
        hint: "网格只在初始化时装进 VAO，之后每帧每层反复绑定使用。Peel 和 Blend 读的是「同一份网格资源」，但每次 Draw 仍是独立管线。",
        highlight: [],
        arrows: [],
        packet: null
      },
      {
        title: "1 · 第 0 层 Peel",
        hint: "整场景再渲染一遍（Spot+玻璃）。用 render 着色器 + 场景 VAO。结果写入 fboPeel_，不是传给 blend.vert。",
        highlight: ["peelBox", "peelTex"],
        arrows: ["aMeshPeel", "aPeelTex"],
        packet: { from: [100, 60], to: [560, 80], cls: "packet" }
      },
      {
        title: "2 · 第 0 层 Blend",
        hint: "另一次 Draw：全屏 quad + blend 着色器。从 fboPeel_.color 采样，混合进 fboAccum_。顶点来自 quad.obj，与 Peel 的 out 无关。",
        highlight: ["blendBox", "accumBox", "peelTex"],
        arrows: ["aTexBlend", "aMeshBlend", "aBlendAccum"],
        packet: { from: [560, 80], to: [560, 240], cls: "packet tex" }
      },
      {
        title: "3 · 第 1 层 Peel（再画一遍场景）",
        hint: "场景再次完整绘制；texture_depth / frontDepth 为第 0 层深度，discard 条件变化，剥离下一层。",
        highlight: ["peelBox", "peelTex"],
        arrows: ["aMeshPeel", "aPeelTex"],
        packet: { from: [100, 60], to: [560, 80], cls: "packet" }
      },
      {
        title: "4 · 第 1 层 Blend",
        hint: "再次全屏混合。fboAccum_ 里已有第 0 层，本层按 Front-to-Back 叠上去。循环直到 sampleCount==0。",
        highlight: ["blendBox", "accumBox", "peelTex"],
        arrows: ["aTexBlend", "aMeshBlend", "aBlendAccum"],
        packet: { from: [560, 80], to: [560, 240], cls: "packet blend" }
      },
      {
        title: "5 · Final 上屏",
        hint: "最后一次 Draw：读 fboAccum_，加背景，写默认帧缓冲。全程接力物始终是纹理，不是 varying。",
        highlight: ["finalBox", "accumBox"],
        arrows: ["aAccumFinal"],
        packet: { from: [560, 240], to: [340, 344], cls: "packet tex" }
      }
    ];

    let i = 0;
    const packet = document.getElementById("packet");
    const boxes = ["peelBox", "peelTex", "blendBox", "accumBox", "finalBox"];
    const arrows = ["aMeshPeel", "aPeelTex", "aTexBlend", "aMeshBlend", "aBlendAccum", "aAccumFinal"];

    function apply(stepIndex) {
      const s = steps[stepIndex];
      document.getElementById("stepLabel").textContent =
        (stepIndex + 1) + " / " + steps.length + "  ·  " + s.title;
      document.getElementById("hint").innerHTML = "<strong>" + s.title + "</strong> — " + s.hint;

      boxes.forEach((id) => {
        const el = document.getElementById(id);
        el.classList.toggle("dim", s.highlight.length > 0 && !s.highlight.includes(id));
      });
      arrows.forEach((id) => {
        const el = document.getElementById(id);
        const on = s.arrows.includes(id);
        el.classList.toggle("dim", !on);
      });

      if (!s.packet) {
        packet.setAttribute("opacity", "0");
        return;
      }
      packet.setAttribute("opacity", "1");
      packet.setAttribute("class", s.packet.cls);
      packet.setAttribute("cx", s.packet.from[0]);
      packet.setAttribute("cy", s.packet.from[1]);
      requestAnimationFrame(() => {
        packet.setAttribute("cx", s.packet.to[0]);
        packet.setAttribute("cy", s.packet.to[1]);
      });
    }

    document.getElementById("btnNext").onclick = () => {
      i = Math.min(i + 1, steps.length - 1);
      apply(i);
    };
    document.getElementById("btnPrev").onclick = () => {
      i = Math.max(i - 1, 0);
      apply(i);
    };
    document.getElementById("btnReset").onclick = () => {
      i = 0;
      apply(i);
    };
    apply(0);
  </script>
</body>
</html>
