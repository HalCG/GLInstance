  <text x="500" y="393" font-size="9" fill="#333">+ 1 + clusterCount</text>
  <text x="500" y="408" font-size="9" fill="#333">+ offsetBytes/4</text>
  <text x="500" y="435" font-size="9" fill="#c01c28">GetClusterInfo(0,1)</text>
  <text x="500" y="450" font-size="9" fill="#c01c28">&#8594; clusterBase=140</text>

  <text x="380" y="508" text-anchor="middle" font-size="9" fill="#888">05_nanitemesh_page.svg</text>
