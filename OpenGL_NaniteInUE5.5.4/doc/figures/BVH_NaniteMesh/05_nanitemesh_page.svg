  <rect x="60" y="325" width="120" height="140" rx="4" fill="#fff" stroke="#1a5fb4"/>
  <text x="120" y="345" text-anchor="middle" font-size="9" fill="#333">Cluster0</text>
  <text x="120" y="360" text-anchor="middle" font-size="8" fill="#666">@ [12]</text>
  <rect x="200" y="325" width="120" height="140" rx="4" fill="#fff" stroke="#1a5fb4"/>
  <text x="260" y="345" text-anchor="middle" font-size="9" fill="#333">Cluster1</text>
  <text x="260" y="360" text-anchor="middle" font-size="8" fill="#666">@ [140]</text>
  <text x="260" y="375" text-anchor="middle" font-size="8" fill="#666">12+512/4</text>
  <rect x="340" y="325" width="120" height="140" rx="4" fill="#fff" stroke="#1a5fb4"/>
  <text x="400" y="345" text-anchor="middle" font-size="9" fill="#333">Cluster2</text>
  <text x="400" y="360" text-anchor="middle" font-size="8" fill="#666">@ [268]</text>

  <text x="500" y="360" font-size="10" fill="#333">clusterBase =</text>
