  <text x="60" y="118" font-size="10" fill="#333">[0] = 2  (pageCount)</text>
  <text x="60" y="136" font-size="10" fill="#333">[1] = 32 bytes  &#8594; Page0 @ uint index 8</text>
  <text x="60" y="154" font-size="10" fill="#333">[2] = 4096 bytes &#8594; Page1 ...</text>

  <rect x="60" y="175" width="640" height="80" rx="4" fill="#fff8e6" stroke="#e5a50a"/>
  <text x="80" y="198" font-size="10" font-weight="600" fill="#e5a50a">Page0 &#39029;&#22836; @ [8..11]</text>
  <text x="80" y="218" font-size="10" fill="#333">[8]=3  clusterCount</text>
  <text x="80" y="236" font-size="10" fill="#333">[9]=0 bytes, [10]=512, [11]=1024  &#8594; cluster0/1/2 &#22312;&#25968;&#25454;&#21306;&#20869;&#20559;&#31227;</text>

  <rect x="40" y="285" width="680" height="200" rx="8" fill="#f0f6ff" stroke="#1a5fb4"/>
