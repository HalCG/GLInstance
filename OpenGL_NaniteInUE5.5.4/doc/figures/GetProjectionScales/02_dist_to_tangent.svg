  <text x="360" y="422" text-anchor="middle" font-size="12" font-weight="600" fill="#333">&#20195;&#30721;</text>
  <text x="55" y="442" font-size="10" fill="#333">DistToTSq = DistToClusterSq - Radius * Radius;</text>
  <text x="55" y="458" font-size="10" fill="#c01c28">DistToT = sqrt(max(0.0, DistToTSq));</text>
  <text x="55" y="478" font-size="10" fill="#666">&#19979;&#19968;&#27493;: ScaledCosTheta=DistToT, ScaledSinTheta=Radius</text>

