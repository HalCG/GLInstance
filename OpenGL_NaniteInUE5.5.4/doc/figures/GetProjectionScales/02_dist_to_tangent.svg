  <text x="445" y="140" font-size="11" fill="#333">DistToT^2 + R^2 = |C|^2</text>
  <text x="445" y="165" font-size="11" fill="#e5a50a">DistToT = sqrt(|C|^2 - R^2)</text>
  <text x="445" y="190" font-size="10" fill="#666">&#20174;&#30456;&#26426;&#21040;&#29699;&#38754;&#30340;</text>
