<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a5fb4"/>
    </marker>
  </defs>
  <rect width="720" height="520" fill="#fafafa"/>
  <text x="360" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1a5fb4">Step 1 / 5 &#8212; &#20998;&#37327;&#20998;&#35299; Z &#19982; X</text>
  <text x="360" y="48" text-anchor="middle" font-size="11" fill="#555">L154-158: DistToClusterSq, Z, X</text>

  <circle cx="120" cy="360" r="10" fill="#333"/>
  <text x="120" y="388" text-anchor="middle" font-size="13" font-weight="600" fill="#333">O &#30456;&#26426;</text>
  <line x1="130" y1="360" x2="580" y2="360" stroke="#1a5fb4" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="590" y="364" font-size="12" fill="#1a5fb4">ViewDirectionWS</text>
  <line x1="120" y1="360" x2="340" y2="360" stroke="#1a5fb4" stroke-width="4"/>
  <text x="230" y="332" text-anchor="middle" font-size="11" fill="#1a5fb4">Z = dot(ViewDir, Center)</text>
  <line x1="340" y1="360" x2="340" y2="140" stroke="#c01c28" stroke-width="4"/>
  <text x="358" y="240" font-size="11" fill="#c01c28">X = sqrt(|C|^2 - Z^2)</text>
  <line x1="120" y1="360" x2="340" y2="140" stroke="#333" stroke-width="4"/>
  <text x="195" y="230" font-size="14" font-weight="600" fill="#333" transform="rotate(-47 195 230)">|C|</text>
  <circle cx="340" cy="140" r="9" fill="#c01c28"/>
  <text x="340" y="122" text-anchor="middle" font-size="13" fill="#c01c28">C &#29699;&#24515;</text>
  <polyline points="330,360 330,350 340,350" fill="none" stroke="#888" stroke-width="2"/>

  <rect x="40" y="420" width="640" height="82" rx="8" fill="#fff" stroke="#1a5fb4"/>
  <text x="360" y="442" text-anchor="middle" font-size="12" font-weight="600" fill="#333">&#20195;&#30721;</text>
  <text x="55" y="462" font-size="10" fill="#333">DistToClusterSq = dot(Center, Center);</text>
  <text x="55" y="478" font-size="10" fill="#1a5fb4">Z = dot(ViewDirectionWS.xyz, Center);</text>
  <text x="55" y="494" font-size="10" fill="#c01c28">X = sqrt(max(0, DistToClusterSq - Z*Z));</text>

  <text x="360" y="512" text-anchor="middle" font-size="9" fill="#888">01_decompose_Z_X.svg</text>
</svg>
